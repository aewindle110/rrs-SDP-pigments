[project]
name = "sdp"
dynamic = ["version"]
description = "Spectral derivative inversion method to estimate phytoplankton pigment concentrations from PACE OCI remote sensing reflectance. Algorithm is called 'SDP'."
readme = "README.md"
authors = [
    { name = "Max Danenhower"},
    { name = "Sasha Kramer"}
]
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.24.1",
    "h5netcdf>=1.6.1",
    "matplotlib>=3.10.3",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "ray>=2.55.1",
    "scipy>=1.15.3",
    "scikit-learn>=1.9.0",
    "xarray>=2025.4.0",
    "numba>=0.59.1"
]

[dependency-groups]
examples = [
    "earthaccess>=0.14.0",    
]

[tool.hatch.version]
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
